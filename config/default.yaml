application:
  name: Cloud Security Compliance and IAM Governance Automation
  environment: development
logging:
  level: INFO
cloud:
  aws_region: us-east-1
  aws_profile:
  aws_role_arn:
  aws_encryption_rules:
    - aws.s3.bucket.encryption-enabled
    - aws.ec2.ebs.volume-encryption-enabled
  # Add only the AWS Config rules whose compliance state should be retrieved.
  aws_config_rule_names: []
  azure_subscription_id: ""
  azure_storage_encryption_rules:
    required_services:
      - blob
      - file
    require_infrastructure_encryption: false
    require_customer_managed_key: false
